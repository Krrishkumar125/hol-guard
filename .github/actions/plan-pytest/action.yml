name: Plan complete pytest suite
description: Collect this interpreter's complete suite and publish its distinct node plan.
inputs:
  python-version:
    description: Python minor version used to name this interpreter's plan artifact.
    required: true
  shard-count:
    description: Number of complete, nonempty node shards.
    required: true
  telemetry-branch:
    description: Trusted target branch from which successful push timings may be restored.
    required: true
  github-token:
    description: Read-only Actions token for optional trusted duration telemetry.
    required: true
runs:
  using: composite
  steps:
    - name: Restore latest trusted duration telemetry
      id: latest-duration-telemetry
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TELEMETRY_BRANCH: ${{ inputs.telemetry-branch }}
      # The manifest candidate exists only when every coverage shard passed and
      # reported, so it is trusted without requiring the whole run to be green.
      # A red main must not pin planning to timings older than the suite.
      run: |
        candidates=$(
          gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name=pytest-duration-manifest-candidate -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false and .name == "pytest-duration-manifest-candidate"
              and .workflow_run.head_branch == env.TELEMETRY_BRANCH)]
              | sort_by(.created_at) | reverse | .[:10][] | "\(.id) \(.workflow_run.id)"'
        )
        artifact_id=
        while read -r candidate run_id; do
          test -n "$run_id" || continue
          read -r event branch workflow_path < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '[.event, .head_branch, .path] | @tsv'
          )
          if test "$event" = "push" &&
            test "$branch" = "$TELEMETRY_BRANCH" &&
            test "$workflow_path" = ".github/workflows/ci.yml"; then
            artifact_id=$candidate
            break
          fi
        done <<< "$candidates"
        test -n "$artifact_id"
        gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/duration-manifest.zip
        unzip -p /tmp/duration-manifest.zip pytest-duration-manifest-candidate.json.gz \
          > /tmp/pytest-duration-manifest.json.gz
        gzip -t /tmp/pytest-duration-manifest.json.gz
        mv /tmp/pytest-duration-manifest.json.gz pytest-duration-manifest.latest.json.gz
    - name: Collect and build affinity-aware pytest shards
      shell: bash
      env:
        CI_PLAN_SHARD_COUNT: ${{ inputs.shard-count }}
      run: |
        uv run --no-sync python scripts/ci/build_pytest_shard_plan.py \
          --shard-count "$CI_PLAN_SHARD_COUNT" \
          --duration-manifest ci/pytest-duration-manifest.json.gz \
          --duration-manifest pytest-duration-manifest.latest.json.gz \
          --max-manifest-age-days 28 \
          --output-directory pytest-shards
    - name: Publish pytest shard plan
      shell: bash
      run: cat pytest-shards/plan.json
    - name: Publish complete protected test inventory
      shell: bash
      run: cat pytest-shards/test-inventory.json
    - name: Upload pytest shard plan
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pytest-shard-plan-${{ inputs.python-version }}
        path: pytest-shards
        if-no-files-found: error
        retention-days: 1
